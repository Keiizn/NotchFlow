name: Build NotchFlow

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Runner Intel : les runners macOS ARM sont saturés ; le binaire reste universel.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags et historique : nécessaires pour le numéro de version

      - name: Versions
        run: |
          sw_vers
          swift --version

      - name: Certificat de signature
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ]; then echo "Pas de certificat : signature ad hoc."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/sign.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/sign.p12"
          HASH=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/NotchFlow Signing/ {print $2; exit}')
          if [ -z "$HASH" ]; then echo "Identité introuvable"; security find-identity "$KEYCHAIN"; exit 1; fi
          echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Compiler et assembler l'app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          bash scripts/build-app.sh release

      - name: Créer l'archive
        run: |
          cd build
          ditto -c -k --keepParent NotchFlow.app NotchFlow.zip

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: NotchFlow
          path: build/NotchFlow.zip

      - name: Publier une release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NotchFlow.zip
