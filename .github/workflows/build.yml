name: Build NotchFlow

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          sw_vers
          swift --version

      - name: Compiler et assembler l'app
        run: bash scripts/build-app.sh release

      - name: Créer l'archive
        run: |
          cd build
          ditto -c -k --keepParent NotchFlow.app NotchFlow.zip

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: NotchFlow
          path: build/NotchFlow.zip

      - name: Publier une release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NotchFlow.zip
